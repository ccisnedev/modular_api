# Pull request titles are Conventional Commits (ADR-0006).
#
# Pull requests are squash-merged, so the title becomes the commit on main, and release-please reads
# that commit to decide the next version: `fix:` and `feat:` release a patch in 0.x, `!` or a
# `BREAKING CHANGE:` footer a minor. A title it cannot parse releases nothing.
#
# pull_request_target so the check also runs for pull requests from forks; it reads only the title and
# never checks out their code.

name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: pr title · conventional commit
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
